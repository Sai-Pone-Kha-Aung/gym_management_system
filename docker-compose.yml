services:
  backend:
    build: ./backend
    container_name: gym_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    expose:
      - "3000"
  frontend:
    build: ./frontend
    container_name: gym_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
